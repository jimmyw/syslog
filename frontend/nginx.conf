server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Serve static assets
    location / {
        try_files $uri $uri/ /index.html;
        gzip_static on;
    }

    # Proxy to ClickHouse HTTP API (GET-only for security)
    location /ch/ {
        limit_except GET { deny all; }
        proxy_pass http://clickhouse:8123/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # CORS for direct browser access if needed
        add_header Access-Control-Allow-Origin *;
    }

    # Long-poll endpoint — blocks until new entries arrive (≤30 s server timeout)
    location /poll {
        proxy_pass http://syslog-receiver:8888/poll;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 35s;
        add_header Cache-Control no-cache;
        add_header Access-Control-Allow-Origin *;
    }

    # SSE stream (kept for potential future use)
    location /stream {
        proxy_pass http://syslog-receiver:8888/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header Cache-Control no-cache;
        add_header Access-Control-Allow-Origin *;
    }

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
}
