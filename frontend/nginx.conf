server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Serve static assets
    location / {
        try_files $uri $uri/ /index.html;
        gzip_static on;
    }

    # Proxy to ClickHouse HTTP API (GET-only for security)
    location /ch/ {
        limit_except GET { deny all; }
        proxy_pass http://clickhouse:8123/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # CORS for direct browser access if needed
        add_header Access-Control-Allow-Origin *;
    }

    # Long-poll endpoint — blocks until new entries arrive (≤30 s server timeout)
    location /poll {
        proxy_pass http://syslog-receiver:8888/poll;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 35s;
        add_header Cache-Control no-cache;
        add_header Access-Control-Allow-Origin *;
    }

    location /ws {
        proxy_pass http://syslog-receiver:8888/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /mcp {
        proxy_pass http://mcp-server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SSE stream (kept for potential future use)
    location /stream {
        proxy_pass http://syslog-receiver:8888/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header Cache-Control no-cache;
        add_header Access-Control-Allow-Origin *;
    }

    # CLI login helper — bounces the session cookie back to a localhost callback.
    # Only allows http://localhost as the target (enforced before redirect).
    location = /api/cli-token {
        if ($arg_cb !~ "^http://localhost") {
            return 403;
        }
        return 302 "$arg_cb?token=$cookie__syslog";
    }

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
}
