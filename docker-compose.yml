services:

  # ─── ClickHouse ────────────────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.5-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: syslog
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:8123:8123"   # HTTP API (internal only)
      - "127.0.0.1:9000:9000"   # Native protocol (internal only)
    networks:
      default:
        ipv4_address: 192.168.10.21

  # ─── Syslog Receiver ───────────────────────────────────────────────────────
  syslog-receiver:
    build: ./syslog-receiver
    restart: unless-stopped
    environment:
      CLICKHOUSE_HOST: clickhouse
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "514:514/udp"     # Syslog UDP
      - "514:514/tcp"     # Syslog TCP
    networks:
      default:
        ipv4_address: 192.168.10.19
      pub_net:
        ipv4_address: 192.168.1.247

  # ─── Syslog Receiver (Rust / io_uring, parallel to the Go one for comparison) ─
  syslog-receiver-rs:
    build: ./syslog-receiver-rs
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined   # default seccomp profile blocks io_uring_setup/enter/register
    environment:
      CLICKHOUSE_HOST: clickhouse
      TABLE: logs_rs
      SYSLOG_PORT: "1514"
      HTTP_PORT: "8889"
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "1514:1514/udp"
      - "1514:1514/tcp"
    networks:
      default:
        ipv4_address: 192.168.10.25

  # Fans a single syslog message out to both receivers above so they can be
  # compared on identical input; also provides `mirror replay` (see README).
  syslog-mirror:
    build: ./syslog-receiver-rs
    entrypoint: ["/usr/local/bin/mirror"]
    restart: unless-stopped
    environment:
      CLICKHOUSE_HOST: clickhouse
    depends_on:
      - syslog-receiver
      - syslog-receiver-rs
    ports:
      - "5514:5514/udp"
    networks:
      default:
        ipv4_address: 192.168.10.26

  # ─── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - clickhouse
      - mcp-server
    # No host port — traffic comes through oauth2-proxy only
    networks:
      default:
        ipv4_address: 192.168.10.22

  # ─── OAuth2 Proxy (GitHub) ─────────────────────────────────────────────────
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    restart: unless-stopped
    command:
      - --provider=github
      - --scope=user:email read:org
      - --github-user=${GITHUB_ALLOWED_USERS}
      - --email-domain=*
      - --upstream=http://frontend:80
      - --http-address=0.0.0.0:80
      - --skip-auth-regex=^/favicon\.ico$
      # MCP OAuth: mcp-server is its own authorization server + bearer-token resource server
      - --skip-auth-regex=^/mcp
      - --skip-auth-regex=^/\.well-known/
      - --skip-auth-regex=^/register$
      - --skip-auth-regex=^/authorize
      - --skip-auth-regex=^/token$
      - --redirect-url=https://syslog.wennlund.nu/oauth2/callback
      - --skip-provider-button=true
      - --cookie-secure=true
      - --cookie-samesite=none
      - --cookie-name=_syslog
      - --cookie-expire=2160h
      - --whitelist-domain=localhost
    environment:
      OAUTH2_PROXY_CLIENT_ID: ${GITHUB_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_COOKIE_SECRET}
    depends_on:
      - frontend
    ports:
      - "8080:4180"
    networks:
      default:
        ipv4_address: 192.168.10.24


  # ─── MCP Server ────────────────────────────────────────────────────────────
  mcp-server:
    build: ./frontend/server/mcp
    restart: unless-stopped
    environment:
      CLICKHOUSE_HOST: clickhouse
      PUBLIC_BASE_URL: https://syslog.wennlund.nu
      GITHUB_ALLOWED_USERS: ${GITHUB_ALLOWED_USERS}
      MCP_GITHUB_CLIENT_ID: ${MCP_GITHUB_CLIENT_ID}
      MCP_GITHUB_CLIENT_SECRET: ${MCP_GITHUB_CLIENT_SECRET}
    volumes:
      - mcp_oauth_data:/data
    depends_on:
      clickhouse:
        condition: service_healthy
    # Accessible via nginx at /mcp — no host port needed
    networks:
      default:
        ipv4_address: 192.168.10.23

volumes:
  clickhouse_data:
    driver: local
  mcp_oauth_data:
    driver: local
networks:
  pub_net:
    external: true
  default:
    name: harbour
    external: true